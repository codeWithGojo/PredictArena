name: PredictArena Phase 1 infrastructure

# Staged only. Repository owner activates by copying to .github/workflows/infra.yml.
on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - run: npm ci --prefix infra --ignore-scripts
      - run: npm run typecheck --prefix infra && npm run build --prefix infra
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/bootstrap validate

  terraform:
    needs: validate
    # Environment approval must review internal PR code before credentials are issued.
    # Fork PRs get offline validation only. No pull_request_target execution.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        stage: [dev, prod]
    runs-on: ubuntu-latest
    environment: ${{ matrix.stage }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: predictarena-terraform-${{ matrix.stage }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_stage: ${{ matrix.stage }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_allowed_origins: ${{ vars.ALLOWED_ORIGINS }}
      TF_VAR_callback_urls: ${{ vars.COGNITO_CALLBACK_URLS }}
      TF_VAR_logout_urls: ${{ vars.COGNITO_LOGOUT_URLS }}
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_VAR_runtime_permissions_boundary_arn: ${{ vars.RUNTIME_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_stub_responses: 'false'
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: npm ci --prefix infra --ignore-scripts && npm run build --prefix infra
      - name: Verify state isolation
        run: |
          test "$TF_STATE_KEY" = "$STAGE/terraform.tfstate"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: predictarena-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Initialize state
        run: >-
          terraform -chdir=infra init -input=false -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=$AWS_REGION"
      - name: Plan
        run: terraform -chdir=infra plan -input=false -lock-timeout=5m -out=foundation.tfplan
      - name: Apply main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform -chdir=infra apply -input=false -lock-timeout=5m foundation.tfplan
      - name: Remove sensitive plan
        if: always()
        run: rm -f infra/foundation.tfplan
